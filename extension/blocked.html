<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard - Page Blocked</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .card {
            width: 500px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 55px;
            color: #dc2626;
        }

        h1 {
            color: #1f2937;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .url {
            margin: 20px 0;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            word-break: break-all;
            text-align: left;
            font-size: 14px;
            color: #374151;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🛑</div>

    <h1>PhishGuard Blocked This Page</h1>

    <p>
        PhishGuard detected a high-risk destination
        and prevented this page from loading.
    </p>

    <div class="url" id="url">
        Blocked URL unavailable
    </div>

    <button id="backButton">
        Go Back
    </button>

</div>

<script src="blocked.js"></script>

</body>
</html>
