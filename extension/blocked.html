<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard - Page Blocked</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .card {
            width: 90%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            line-height: 1.6;
            color: #6b7280;
        }

        .warning {
            margin: 24px 0;
            padding: 14px;
            background: #fef2f2;
            border-radius: 10px;
            color: #991b1b;
            font-size: 14px;
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .brand {
            margin-top: 24px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">!</div>

        <h1>Page Blocked</h1>

        <p>
            PhishGuard detected this website as
            <strong>high-risk</strong>.
        </p>

        <div class="warning">
            For your protection, PhishGuard prevented
            this page from loading.
        </div>

        <button onclick="history.back()">
            Go Back
        </button>

        <div class="brand">
            Protected by PhishGuard
        </div>

    </div>

</body>
</html>
